name: Windows

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        with:
          vs-version: '[17.0,18.0)'
      - name: Build core diagnostics and run log self-test
        shell: pwsh
        run: ./scripts/build-diagnostics.ps1 -Configuration ChinaServer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-diagnostics-ChinaServer
          path: artifacts/diagnostics/ChinaServer/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload owned-process control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owned-loader-control
          path: |
            artifacts/loader-control/*.exe
            artifacts/loader-control/*.dll
            artifacts/loader-control/*.log
          if-no-files-found: warn
          retention-days: 14
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [RiotGamesServers, ChinaServer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/release.ps1 -Configuration '${{ matrix.configuration }}'
      - name: Upload checked release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.configuration }}
          path: artifacts/release/*/*
          if-no-files-found: error
          retention-days: 14
